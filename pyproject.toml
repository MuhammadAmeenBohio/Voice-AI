[project]
name = "voice-ai-patient-registration"
version = "1.0.0"
description = "Voice AI Patient Registration System with FastAPI, SQLite, and Vapi"
authors = [{ name = "Candidate" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "python-dotenv>=1.0.0",
    "pydantic[email]>=2.0.0",
    "email-validator>=2.0.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
